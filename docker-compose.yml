#======================================================
# STORES LOCAL
#=======================================================
  store-ms:
    build: ./stores-microservice
    volumes:
      - ./stores-microservice/src:/usr/src/app/src
    command: npm run start:dev
    environment:
      - PORT=3011
      - NATS_SERVERS=nats://nats-server:4222
      - DATABASE_URL=${DATABASE_URL_STORES}
    depends_on:
      stores-db:
        condition: service_healthy 

  stores-db:
    container_name: stores_ms_db
    image: postgres:16.2
    restart: always
    volumes:
      - ./postgres/stores:/var/lib/postgresql/data
    ports:
      - 5431:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=stores-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 15s
      retries: 10
#======================================================
# PRODUCTS LOCAL
#=======================================================
  productss-ms:
    build: ./productss-microservice
    volumes:
      - ./productss-microservice/src:/usr/src/app/src
    command: npm run start:dev
    environment:
      - PORT=3010
      - NATS_SERVERS=nats://nats-server:4222
      - DATABASE_URL=${DATABASE_URL_PRODUCTSS}
    depends_on:
      products-db:
        condition: service_healthy 

  products-db:
    container_name: products_db
    image: postgres:16.2
    restart: always
    volumes:
      - ./postgres/products:/var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=products-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 15s
      retries: 10
#======================================================
# ORDENES LOCAL
#=======================================================
  orders-ms:
    build: ./orders-microservice
    volumes:
      - ./orders-microservice/src:/usr/src/app/src
    command: npm run start:dev
    environment:
      - PORT=3002
      - DATABASE_URL=${DATABASE_URL_POSTGRES}
      - NATS_SERVERS=nats://nats-server:4222
    depends_on:
      orders-db:
        condition: service_healthy  

  orders-db:
    container_name: orderdb
    image: postgres:16.2
    restart: always
    volumes:
      - ./postgres/orders:/var/lib/postgresql/data
    ports:
      - 5430:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=ketchup1234
      - POSTGRES_DB=orderdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 10
#======================================================
# PAYMENTS LOCAL
#=======================================================
  payment-ms:
    build: ./payments-microservice
    ports:
      - ${PAYMENT_MS_PORT}:${PAYMENT_MS_PORT}
    volumes:
      - ./payments-microservice/src:/usr/src/app/src
    command: npm run start:dev
    environment:
      - PORT=${PAYMENT_MS_PORT}
      - STRIPE_SECRET=${STRIPE_SECRET}
      - STRIPE_SUCCESS_URL=${STRIPE_SUCCESS_URL}
      - STRIPE_CANCEL_URL=${STRIPE_CANCEL_URL}
      - STRIPE_ENDPOINT_SECRET=${STRIPE_ENDPOINT_SECRET}
      - NATS_SERVERS=nats://nats-server:4222
  
  auth-ms:
    build: ./auth-microservice
    volumes:
      - ./auth-microservice/src:/usr/src/app/src
    command: npm run start:dev
    environment:
      - PORT=3004
      - NATS_SERVERS=nats://nats-server:4222
      - DATABASE_URL=${AUTH_DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}


      
#======================================================
# FRONT-END
#=======================================================
  front-end:
    build: 
     context: ./front-end/app
     dockerfile: dockerfile
    volumes:
      - ./front-end/app/src:/usr/src/app/src
    ports:
      - 4000:4000
    command: npm run dev
    environment:
      - PORT=4000
      - BACKEND_URL=${BACKEND_URL_TO_FRONT_END}

  node_exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    ports:
    - 9100:9100
    ###### linux
    # command:
    # - '--path.rootfs=/host'
    # pid: host
    # volumes:
    # - '/:/host:ro,rslave'
    ###### windows
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    command: 
      - '--path.procfs=/host/proc' 
      - '--path.sysfs=/host/sys'
      - --collector.filesystem.ignored-mount-points
      - "^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)"

  grafana:
    # image: grafana/grafana:8.0.6
    image: grafana/grafana:8.0.6
    container_name: grafana
    restart: unless-stopped
    volumes:
    - grafana-data:/var/lib/grafana
    ports:
    - 5000:3000

  prometheus:
    # image: prom/prometheus:v2.28.1
    image: prom/prometheus
    container_name: prometheus
    restart: unless-stopped
    volumes:
    - ./prometheus.yml:/etc/prometheus/prometheus.yml
    - prometheus-data:/prometheus
    ports:
    - 9090:9090
    command:
    - '--config.file=/etc/prometheus/prometheus.yml'
    - '--storage.tsdb.path=/prometheus'
    - '--storage.tsdb.retention.time=1y'
    - '--web.enable-lifecycle'
  # grafana:
  #   image: grafana/grafana-enterprise
  #   ports:
  #     - 5000:3000

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    expose:
    - 8080
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:rw
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    
  app_example:
    image: quay.io/brancz/prometheus-example-app:v0.3.0
    container_name: app_example
    restart: unless-stopped
    ports:
    - 80:8080