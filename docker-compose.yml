version: '3'

volumes:
  grafana-data:
  prometheus-data:
services:
  nats-server:
    image: nats:latest
    ports:
      - "4222:4222"  # Client port
      - "8222:8222"  # Monitoring port

  client-gateway:
    build: ./client-gateway
    ports:
      - 3000:3000
    volumes:
      - ./client-gateway/src:/usr/src/app/src
    command: npm run start:dev
    environment:
      - PORT=3000
      - NATS_SERVERS=nats://nats-server:4222


