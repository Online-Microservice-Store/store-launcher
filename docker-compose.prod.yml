# version: '3'

services:

#=====================================
# NATS
#====================================
  nats-server:
    image: nats:latest


#=====================================
# BACKEND
#=====================================

  auth-ms:
    build: 
      context: ./auth-microservice
      dockerfile: dockerfile.prod
    image: us-west1-docker.pkg.dev/tienda-ms-452101/image-registry/auth-ms
    environment:
      - PORT=3004
      - NATS_SERVERS=nats://nats-server:4222
      - DATABASE_URL=${AUTH_DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}

  client-gateway:
    build: 
      context: ./client-gateway
      dockerfile: dockerfile.prod
    image: us-west1-docker.pkg.dev/tienda-ms-452101/image-registry/client-gateway 
    ports:
      - ${CLIENT_GATEWAY_PORT}:3000
    environment:
      - PORT=3000
      - NATS_SERVERS=nats://nats-server:4222


  notifications-ms:
    build: 
      context: ./notifications-microservice
      dockerfile: dockerfile.prod
      args:
        - NOTIFICATIONS_DB_URL=${NOTIFICATIONS_DB_URL_NEON}
    image: us-west1-docker.pkg.dev/tienda-ms-452101/image-registry/notifications-ms
    environment:
      - PORT=3002
      - DATABASE_URL=${NOTIFICATIONS_DB_URL_NEON}
      - NATS_SERVERS=nats://nats-server:4222


  orders-ms:
    build: 
      context: ./orders-microservice
      dockerfile: dockerfile.prod
      args:
        - ORDERS_DB_URL=${ORDERS_DB_URL_NEON}
    image: us-west1-docker.pkg.dev/tienda-ms-452101/image-registry/orders-ms
    environment:
      - PORT=3002
      - DATABASE_URL=${ORDERS_DB_URL_NEON}
      - NATS_SERVERS=nats://nats-server:4222

  payment-ms:
    build: 
      context: ./payments-microservice
      dockerfile: dockerfile.prod
    image: us-west1-docker.pkg.dev/tienda-ms-452101/image-registry/payment-ms
    ports:
      - ${PAYMENT_MS_PORT}:${PAYMENT_MS_PORT}
    environment:
      - PORT=${PAYMENT_MS_PORT}
      - STRIPE_SECRET=${STRIPE_SECRET}
      - STRIPE_SUCCESS_URL=${STRIPE_SUCCESS_URL}
      - STRIPE_CANCEL_URL=${STRIPE_CANCEL_URL}
      - STRIPE_ENDPOINT_SECRET=${STRIPE_ENDPOINT_SECRET}
      - NATS_SERVERS=nats://nats-server:4222

  products-ms:
    build: 
      context: ./productss-microservice
      dockerfile: dockerfile.prod
      args:
        - PRODUCTS_DB_URL=${PRODUCTS_DB_URL_NEON}
    image: us-west1-docker.pkg.dev/tienda-ms-452101/image-registry/products-ms
    environment:
      - PORT=3002
      - DATABASE_URL=${PRODUCTS_DB_URL_NEON}
      - NATS_SERVERS=nats://nats-server:4222

  stores-ms:
    build: 
      context: ./stores-microservice
      dockerfile: dockerfile.prod
      args:
        - STORES_DB_URL=${STORES_DB_URL_NEON}
    image: us-west1-docker.pkg.dev/tienda-ms-452101/image-registry/stores-ms
    environment:
      - PORT=3002
      - DATABASE_URL=${STORES_DB_URL_NEON}
      - NATS_SERVERS=nats://nats-server:4222

